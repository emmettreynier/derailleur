# Per-project manifest — the onboarding unit. Version-controlled = portable.
# Read by the raw-data deny-hook and the dispatch tooling.
#
# Second stage of the distance-decay water-quality model. Code-only git repo;
# the large shared data live in the sibling Dropbox repo `distance-decay` and are
# symlinked in by the repo's own setup-symlinks.sh as two top-level dirs:
#   06 Raw_data   -> survey microdata + HUC shapefiles            (read-only)
#   07 Dataclean  -> first-stage .dta/secchi + per-survey inputs  (read-only)
#                    AND per-survey outputs/ + results/           (WRITABLE)
# The launcher runs setup-symlinks.sh in each worktree (it ships one), so a fresh
# worktree gets these symlinks pointing back at the shared Dropbox tree.

repo: emmettreynier/distance-decay-est
project: Water                  # board "Project" field value
archetype: git-native           # git-native | dropbox-native
#   Repo lives OUTSIDE Dropbox (git-backed). Shared data lives in Dropbox and is
#   symlinked in — protected read-only by the deny-hook (see raw_resolved below).

# Worker git workspace (outside Dropbox).
working_clone: ~/projects/distance-decay-est
worktrees_dir: ~/orchestrator/worktrees/distance-decay-est

# Data layout — the `06 Raw_data` / `07 Dataclean` symlinks are gitignored, so a
# fresh worktree has no data until setup-symlinks.sh runs. data_root is the repo
# root (that's where those symlinks live); raw_paths/output_paths are resolved
# against it and canon-resolved through the symlinks into shared Dropbox.
data_root: ~/projects/distance-decay-est

# raw_resolved — the shared Dropbox data home. Serves two roles:
#   (1) launcher --add-dir's it so the worker can READ through the symlinks;
#   (2) the deny-hook blanket write-protects everything under it...
# ...EXCEPT the output_paths carveouts below. Its parent dir is the DROPBOX_PROJ
# root that setup-symlinks.sh expects, so the launcher derives it from here.
raw_resolved: ~/Dropbox/projects/water-projects/distance-decay
dropbox_pinned_offline: true   # 06 Raw_data + 07 Dataclean first-stage inputs pinned "Available offline"
#   NOTE: outputs are large and MUST sync to coauthors via Dropbox, so workers
#   write straight THROUGH the symlink into the shared tree — intentional, and
#   safe because only one worker runs on this project at a time (no output race).

# READ-ONLY. The deny-hook blocks any write/delete whose canonical (symlink-
# resolved) path is under raw_resolved. That already covers all of 06 Raw_data
# and 07 Dataclean, so no raw_paths enumeration is needed — the writable outputs
# below are punched back through as carveouts.
raw_paths: []

# WRITABLE carveouts — dirs that stay writable even though they're nested under
# raw_resolved. This is where the estimation + experiment scripts write:
#   <survey>/outputs/  -> …parameters.csv (resume-safe appends)
#   <survey>/results/  -> WTP, comparison tables, figures (scripts 05, 08–15)
output_paths:
  - 07 Dataclean/sp-johnston/outputs/
  - 07 Dataclean/sp-johnston/results/
  - 07 Dataclean/sp-vossler/outputs/
  - 07 Dataclean/sp-vossler/results/
  - 07 Dataclean/sp-ncee/outputs/
  - 07 Dataclean/sp-ncee/results/
