# Per-project manifest — the onboarding unit. Version-controlled = portable.
# Read by the raw-data deny-hook and the dispatch tooling.
#
# ⚠️ HIGHER-RISK REPO. Uses restricted-use NCHS microdata (see the repo's CLAUDE.md
# hard-constraint: never read/print raw health data; all code touching it needs the
# user's approval). Confidentiality is the GATE for going live here — read the
# "Confidentiality model" note below before dispatching a worker.

repo: emmettreynier/glyphosate-neonatal-health
project: Pesticides             # board "Project" field value
archetype: git-native           # git-native | dropbox-native
#   The repo lives OUTSIDE Dropbox and is git-backed, so it's git-native.
#   The large + restricted data live in the Dropbox copy and are symlinked back in
#   (see the repo's setup-symlinks.sh / README); protected by the deny-hook + scoping below.

# Worker git workspace — the existing clone is already outside Dropbox.
working_clone: ~/projects/glyphosate-neonatal-health
worktrees_dir: ~/orchestrator/worktrees/glyphosate-neonatal-health

# Data layout — data/ is machine-local and gitignored; the data lives in the Dropbox
# copy under pesticide-projects/ and is symlinked in by the repo's setup-symlinks.sh.
data_root: ~/projects/glyphosate-neonatal-health/data

# raw_resolved — the read-only raw tree the worker MAY read (and that the launcher
# --add-dir's + symlinks to data/raw). Deliberately the PUBLIC raw only
# (chen-replication/data/raw: USGS pesticide panel etc.), which also happens to be
# this repo's real data/raw target — so the bootstrap symlink is correct AND the
# worker's readable scope never includes restricted health data. The RESTRICTED
# paths below are intentionally NOT here.
raw_resolved: ~/Dropbox/projects/pesticide-projects/chen-replication/data/raw
dropbox_pinned_offline: false
#   TODO(pin): pin the restricted (clean-nchs/output/by_year) + raw trees
#   "Available offline" in Dropbox before any live run, so Dropbox can't evict them.

# ── Confidentiality model (READ-ME before live dispatch) ──────────────────────
# The deny-hook blocks WRITES/DELETES into the canonical (symlink-resolved) prefixes
# below; it does NOT block reads. READ-protection of restricted data comes from
# --add-dir scoping: the worker can only read the worktree + raw_resolved (public
# raw). The restricted NCHS data (data/health-restricted -> clean-nchs/output/by_year,
# the single restricted path) is never --add-dir'd and must never be symlinked into a
# worker's worktree — that, not the deny-hook, is what keeps a worker from reading
# confidential microdata. Listing it in raw_paths is defense-in-depth: if the
# restricted symlink is ever present in a worktree, writes/deletes through it are blocked too.
#
# READ-ONLY. Paths relative to data_root unless absolute; canon-resolved through symlinks.
raw_paths:
  - health-restricted/   # -> clean-nchs/output/by_year — cleaned NCHS microdata (RESTRICTED; the sole restricted path)
  - raw/                 # -> chen-replication/data/raw — public USGS etc. (re-downloadable)
  - reynier/             # -> chen-replication/data/reynier — suitability / shift-share inputs

# Writable worker outputs (documentation + worktree bootstrap; not enforcement —
# the deny-hook is a denylist that blocks raw_paths and allows the rest).
# ⚠️ TODO(outputs): the repo's cache/ + output/{tables,figures} are symlinks into the
# SHARED Dropbox copy, so a worker writing through them mutates shared state and races
# the main clone / other workers. Before dispatching any pipeline-WRITING issue, resolve
# whether the worktree gets isolated (worktree-local) cache/output or only non-writing
# issues are dispatched. First dry-run should target a non-restricted, non-pipeline issue.
output_paths:
  - cache/               # intermediate .rds/.qd (SHARED Dropbox symlink — see TODO above)
  - output/tables/       # regression tables (SHARED Dropbox symlink)
  - output/figures/      # figures (SHARED Dropbox symlink)
