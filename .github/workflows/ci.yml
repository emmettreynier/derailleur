name: CI

# Runs the OFFLINE tier of the derailleur test suite (dr test --offline) on two
# platforms. The offline tier is deterministic and needs no network / gh auth, so CI
# needs no secrets. The online tier is not run here (it has no gh auth and SKIPs).
#
# - macos-latest: that runner still ships bash 3.2, the same interpreter the operator's
#   Mac uses, so CI exercises the real bash-3.2 compat constraints (empty-array under
#   set -u, bare-short-circuit return under set -e) rather than papering over them.
# - ubuntu-latest: bash 5 + GNU coreutils, the userland of the DGX (the default work
#   site). It catches GNU/BSD differences the macOS leg cannot, e.g. #92's BSD-first
#   `stat -f`, which returned garbage on GNU while macOS CI stayed green (issue #102).
on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Show bash version (should be 3.2, the compat target)
        run: bash --version | head -1
      - name: Run offline test tier
        run: ./bin/test.sh --offline

  offline-tests-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install test dependencies (jq; tmux for the tmux-backed tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q jq tmux
      - name: Show bash and coreutils versions (GNU userland, like the DGX)
        run: |
          bash --version | head -1
          date --version | head -1
          stat --version | head -1
      - name: Run offline test tier
        run: ./bin/test.sh --offline
