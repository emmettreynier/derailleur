<!--
templates/project.yml — the canonical per-project manifest shape (the onboarding unit).

This is the single source of truth for what a manifest looks like. `bin/new-project.sh`
renders it into `projects/<slug>.yml` at onboard time, substituting the {{TOKEN}}
placeholders below (same {{TOKEN}} convention as briefs/*-brief.md); you can also copy
it by hand and fill it in. Real manifests live in projects/ and are gitignored — only
this sanitized template is tracked.

All values below are placeholders. Fill the {{TOKENS}} (new-project.sh does this for you)
and resolve every `TODO:` before the first real dispatch.
-->
# Per-project manifest — the onboarding unit. Read by the raw-data deny-hook and the
# dispatch tooling. Scaffolded by new-project.sh — FILL THE TODOs before first dispatch.

repo: {{REPO}}                  # owner/repo the worker/checker operate on
project: TODO                   # board "Project" field value (e.g. Water/Pesticides/Climate/Energy/Other)

# archetype — how the repo relates to its data (see README "Onboard a project"):
#   git-native      (preferred) repo is git-only and lives OUTSIDE any cloud-sync
#                   folder; large or confidential data live elsewhere and are symlinked
#                   into data/. Worktrees are trivial; raw is protected read-only by
#                   file perms or the deny-hook.
#   dropbox-native  (legacy/coauthored) the canonical repo lives inside a cloud-sync
#                   folder; workers operate from an out-of-sync working clone, and raw
#                   data is pinned "available offline" + protected by the deny-hook.
#                   Use only when coauthors require the synced layout.
archetype: {{ARCHETYPE}}        # git-native | dropbox-native

# Worker git workspace — the working clone lives OUTSIDE any cloud-sync folder so git
# and the sync client never fight over the same tree. Paths use literal ~ (portable
# across machines/users); the launchers expand ~ at read time.
working_clone: {{WORKING_CLONE}}
worktrees_dir: {{WORKTREES_DIR}}

# Data layout — data/ is machine-local and gitignored; each environment provides its
# own, so nothing here is tracked in the repo. The launcher bootstraps each worktree
# with:
#   data/raw     -> symlink to raw_resolved       (READ-ONLY)
#   data/derived -> symlink to derived_resolved   (WRITABLE, shared; only if set)
#   data/results -> writable worker output
# raw_resolved keys the deny-hook, so raw protection holds regardless of how data/ is
# provided on a given machine.
#
# The layout these three names come from is the research-repo standard defined by
# emmettreynier/research-template (see its AGENTS.md > Data). This manifest ENFORCES that
# standard operationally; the template DEFINES it. A repo that predates the standard, or
# deliberately deviates, keeps its own setup-symlinks.sh plus critical_paths below — that
# local escape hatch is why nothing here is required to conform.
#
# NOT provisioned into worktrees: the standard's `misc/` (a host-only Dropbox symlink for
# data-use agreements, correspondence, scans). A worker has no need-to-know for any of it,
# and --add-dir scoping — not the deny-hook — is what actually gates reads, so leaving
# misc/ off the worktree is what keeps the confidentiality surface small. Do not add it.
#
# CODE-ONLY REPO (no research-data tree — e.g. a tooling repo, or derailleur
# self-hosted): there is no raw tree to point at. Set BOTH data_root and raw_resolved
# to the repo root itself (the same path as working_clone). That (1) hands the launcher
# a valid, non-empty --add-dir + makes the deny-hook write-protect the whole live clone,
# and (2) is the signal the launcher keys on to SKIP the default data/raw+data/results
# scaffold — without it, a code repo gets a spurious self-referential data/ dir (see
# projects/derailleur.yml for a worked example). Leave raw_paths/output_paths empty.
data_root: {{DATA_ROOT}}
raw_resolved: TODO              # raw tree data/raw points at; for a code-only repo, = working_clone (see above)
# derived_resolved: OPTIONAL. The shared derived-data tree that data/derived points at.
# Leave UNSET unless you want it: with no value, the launcher behaves exactly as it did
# before this key existed — no data/derived link, and a byte-identical assembled command.
#
# Set it when intermediates are expensive enough that recomputing them in every worktree
# is the bottleneck. Two consequences to accept before you do:
#   1. It is WRITABLE, deliberately. A worker whose issue is "build the panel" has to be
#      able to write the panel. Read-only here would make that class of issue impossible.
#   2. Because it is shared AND writable, two concurrent issues touching the same derived
#      artifact can RACE. Accepted and documented rather than defended with locking —
#      everything under derived/ is regenerable from raw + code, so the blast radius is
#      "redo some compute" (design.md principle 5), never lost data. If a race would be
#      costly, don't set the key: per-worktree derived data is the safe default.
# The deny-hook carves this path out of the raw denylist automatically, so you do NOT also
# need to list data/derived in output_paths. Never point it inside the raw tree.
#   derived_resolved: ~/Dropbox/projects/<area>/<project>/data/derived
dropbox_pinned_offline: false   # set true (dropbox-native) once raw is pinned "available offline"
# dropbox_proj: OPTIONAL. Only for a repo that ships its own setup-symlinks.sh AND whose
# Dropbox root differs from that script's built-in default. The launcher runs the repo's
# setup-symlinks.sh --worker to provision the worktree's data links; if set, this value
# is exported as DROPBOX_PROJ to override the script's default. Leave UNSET normally — the
# shipped scripts already default DROPBOX_PROJ to the host's ~/Dropbox/projects/... layout,
# and the launcher must NOT guess it from raw_resolved (that doubled the project path and
# silently created zero links — issue #25).

# critical_paths: OPTIONAL. The load-bearing input link(s) this repo's worktree MUST have
# before a worker/checker starts, as a list of paths relative to the worktree root. Before
# dispatch, the launcher's host-side gate asserts EVERY listed path exists and resolves to
# a real directory, aborting the dispatch (before `claude` is spawned) if any doesn't — so
# a worker never computes on missing inputs and exits 0 (issues #25/#35/#43). Use this for
# any repo whose load-bearing links are NOT the generic data/raw — i.e. a repo that ships
# its own setup-symlinks.sh creating its own link names. Example for distance-decay-est,
# whose setup-symlinks.sh creates two top-level dirs (mind the space — quote them):
#   critical_paths:
#     - "06 Raw_data"
#     - "07 Dataclean"
# When OMITTED, the gate defaults to asserting the generic data/raw link (the branch-(b)
# template invariant). Code-only manifests (raw_resolved == working_clone) and repos with
# no raw_resolved are exempt. A repo that ships its own setup-symlinks.sh but declares no
# critical_paths gets no hard gate on its inputs (it never scaffolds data/raw) — declare
# them here to gate it.

# ── Confidentiality (READ before a live dispatch on a repo with confidential data) ──
# The deny-hook blocks WRITES/DELETES under the raw prefixes below; it does NOT block
# reads. READ-protection of sensitive data comes from --add-dir scoping: a worker can
# only read the worktree + raw_resolved. If a repo has confidential inputs (e.g.
# protected-use microdata), point raw_resolved at the PUBLIC raw only and NEVER
# --add-dir or symlink the confidential tree into a worktree — that, not the deny-hook,
# is what keeps a worker from reading it. Listing a confidential path in raw_paths is
# defense-in-depth (blocks writes if the symlink is ever present), not read-protection.

# READ-ONLY. The deny-hook blocks any write/delete whose canonical (symlink-resolved)
# path is under one of these prefixes. Paths are relative to data_root unless absolute.
# Use [] if raw_resolved itself is blanket write-protected and you only carve out
# writable subdirs via output_paths below.
raw_paths:
  - raw/                        # the entire raw tree, no exceptions

# Writable worker outputs. Two roles: (1) documentation + worktree bootstrap (dirs the
# launcher creates); (2) explicit allow-carveouts over the raw denylist above — needed
# when a repo's writable outputs live INSIDE a shared raw/data tree (the deny-hook is a
# denylist: block raw_paths, allow the rest, re-allow these).
output_paths:
  - data/results/               # worker-generated outputs / intermediate artifacts
